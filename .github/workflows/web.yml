# Build the web version and the accessible Rose Hill Campus Guide, check them,
# and publish them to GitHub Pages on every push to main (decisions/0034, 0037).
# A failing test or accessibility check stops the publish.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pyxel (the version the page loads) and the test tools
        run: pip install pyxel==2.9.9 pytest pillow
      - name: Run the tests
        run: python -m pytest -q
      - name: Build the game page and the Campus Guide
        run: python tools/build_web.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the accessibility checker
        run: |
          npm install --no-save --no-audit --no-fund axe-core@4.13.0 playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Check accessibility (WCAG 2.2 AA rules, axe-core)
        run: node tools/check_accessibility.cjs build/web
      - name: Check the page at phone sizes (decisions/0043)
        run: node tools/check_phone.cjs build/web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
