[project]
name = "fordham-campus-quest"
version = "0.2.0"
description = "A Pokemon-style campus exploration game for new Fordham students, built with Pyxel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyxel>=2.9"]

[dependency-groups]
dev = ["pytest>=8", "pillow>=10"]  # pillow: building picture checks and art drafts

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
